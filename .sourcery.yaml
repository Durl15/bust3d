# DJ AI Business Consultant LLC - Sourcery review config
version: '1'

ignore:
  - .git
  - .venv
  - venv
  - node_modules
  - dist
  - build
  - "**/*.min.js"

rule_settings:
  enable:
    - default
  disable: []
  rule_types:
    - refactoring
    - suggestion
    - comment
  python_version: '3.11'

github:
  labels: []
  ignore_labels:
    - sourcery-ignore
  request_review: author
  sourcery_branch: sourcery/{base_branch}

clone_detection:
  min_lines: 4
  min_duplicates: 2
  identical_clones_only: false